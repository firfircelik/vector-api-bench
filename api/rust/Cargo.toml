[package]
name = "vecapi"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
pgvector = { version = "0.4", features = ["postgres"] }
bytes = "1"
duckdb = { version = "=1.10506.1" }
lancedb = { version = "=0.40.0", default-features = false, features = ["remote"] }  # 0.40.0 does not compile without "remote" (job.rs uses Error::Http); local tables only
arrow-array = "58"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 4
